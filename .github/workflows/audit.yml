name: Auditoría de dependencias

on:
  schedule:
    # Los avisos de seguridad se revisan cada lunes por la mañana.
    - cron: "17 7 * * 1"
  workflow_dispatch:

jobs:
  audit:
    name: Avisos de seguridad
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Repositorio
        uses: actions/checkout@v5

      - name: pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.14.0

      - name: Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.20.0
          cache: pnpm

      - name: Dependencias
        run: pnpm install --frozen-lockfile

      - name: Auditoría de producción
        run: pnpm audit --prod --audit-level=high

      # La auditoría de desarrollo es informativa: braces (transitiva de
      # eslint-config-next) no tiene versión corregida.
      - name: Avisos de desarrollo
        run: pnpm audit --audit-level=high || true

      - name: Versiones anticuadas
        run: pnpm outdated || true
