name: Extremo a extremo

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Chromium contra la compilación de producción
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: escribiendo_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5433/escribiendo_test
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5433/escribiendo_test
      E2E_SETUP_TOKEN: e2e-token-de-pruebas-con-mas-de-treinta-y-dos-caracteres
      # La aplicación lee SETUP_TOKEN; las pruebas, E2E_SETUP_TOKEN.
      SETUP_TOKEN: e2e-token-de-pruebas-con-mas-de-treinta-y-dos-caracteres
      NEXT_TELEMETRY_DISABLED: "1"
      # Clave desechable y pública solo para la base E2E, nunca para producción.
      EXPORT_SIGNING_SECRET: clave-exclusiva-e2e-no-usar-en-produccion

    steps:
      - name: Repositorio
        uses: actions/checkout@v5

      - name: pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.14.0

      - name: Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.20.0
          cache: pnpm

      - name: Dependencias
        run: pnpm install --frozen-lockfile

      - name: Generar el cliente de Prisma
        run: pnpm db:generate

      - name: Aplicar las migraciones
        run: pnpm db:migrate

      - name: Navegador
        timeout-minutes: 5
        # La imagen incluye las bibliotecas de Chrome; las fuentes editoriales están en el repo.
        run: pnpm exec playwright install --only-shell chromium

      - name: Compilación de producción
        run: pnpm build

      - name: Pruebas de extremo a extremo
        run: pnpm exec playwright test

      - name: Conservar informe, capturas y trazas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
