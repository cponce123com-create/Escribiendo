name: DOCX con LibreOffice

on:
  push:
    branches: [main, improvement/**]
    paths:
      - "packages/export-engine/**"
      - "scripts/validate-docx*.ts"
      - "scripts/lib/export-fixtures.ts"
      - "scripts/pdfjs/**"
      - ".github/workflows/docx.yml"
  pull_request:
    paths:
      - "packages/export-engine/**"
      - "scripts/validate-docx*.ts"
      - "scripts/lib/export-fixtures.ts"
      - "scripts/pdfjs/**"
      - ".github/workflows/docx.yml"
  workflow_dispatch:

concurrency:
  group: docx-${{ github.ref }}
  cancel-in-progress: true

jobs:
  libreoffice:
    name: LibreOffice abre el DOCX
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Repositorio
        uses: actions/checkout@v5

      - name: pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.14.0

      - name: Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.20.0
          cache: pnpm

      - name: Dependencias
        run: pnpm install --frozen-lockfile

      - name: Cliente de Prisma
        run: pnpm db:generate

      - name: Validador de pdf.js
        run: pnpm --dir scripts/pdfjs install --frozen-lockfile

      - name: LibreOffice
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer
          soffice --version

      - name: Validar el DOCX
        env:
          DOCX_VALIDATION_DIR: ${{ github.workspace }}/artifacts/docx-libreoffice
        run: pnpm validate:docx:libreoffice

      - name: Guardar el DOCX y el PDF
        uses: actions/upload-artifact@v4
        with:
          name: docx-libreoffice
          path: artifacts/docx-libreoffice
          if-no-files-found: error
