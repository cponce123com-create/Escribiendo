version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencias"
    ignore:
      # Prisma 7 elimina url/directUrl del schema y exige prisma.config.ts y un
      # adaptador de conexión. Se mantiene 6.x hasta completar la migración.
      - dependency-name: "prisma"
        versions: ["7.x"]
      - dependency-name: "@prisma/client"
        versions: ["7.x"]

  - package-ecosystem: "npm"
    directory: "/scripts/pdfjs"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
    labels:
      - "dependencias"
      - "herramientas"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencias"
      - "acciones"
