services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: escribiendo
      POSTGRES_PASSWORD: escribiendo_e2e
      POSTGRES_DB: escribiendo_test
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U escribiendo -d escribiendo_test"]
      interval: 2s
      timeout: 3s
      retries: 30
